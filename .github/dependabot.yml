# Weekly and grouped so PRs stay few. Security updates are not scheduled and skip the cooldown;
# the `applies-to: security-updates` group puts them in one PR.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    versioning-strategy: increase
    cooldown:
      default-days: 3
      semver-major-days: 14
    ignore:
      # Node 22 is the baseline (.nvmrc, engines); moving to a newer Node is a decision, not a bump.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    # A dependency joins the first group that matches it, so the specific groups come first.
    groups:
      react-router:
        patterns: ["react-router", "@react-router/*"]
      cloudflare:
        patterns: ["wrangler", "@cloudflare/*"]
      # Pinned exactly (Oxfmt is 0.x and may reformat code): review each bump with `npm run format`.
      oxc:
        patterns: ["oxlint", "oxfmt", "oxlint-tsgolint"]
      npm:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
      npm-major:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [major]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
